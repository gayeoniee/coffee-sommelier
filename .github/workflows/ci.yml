name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # tests/conftest.py creates coffee_test through the "coffee" database (DB tests skip without Postgres)
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: coffee
          POSTGRES_PASSWORD: coffee
          POSTGRES_DB: coffee
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coffee"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://coffee:coffee@localhost:5432/coffee_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t coffee-api .
      # the API must import with only its runtime deps (no pipeline group: pandas, bs4, ...)
      - run: docker run --rm coffee-api python -c "import app.api, sys; assert 'pandas' not in sys.modules"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  # Render's GitHub auto-deploy needs its GitHub app on the repo; until then CI triggers the deploy through the API
  # once every job on main is green (RENDER_API_KEY repo secret; skipped when it is absent).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, image, web]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then echo "no RENDER_API_KEY secret; skipping"; exit 0; fi
          sid=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services?name=coffee-sommelier-api&limit=1" | python3 -c 'import sys,json;print(json.load(sys.stdin)[0]["service"]["id"])')
          curl -fsS -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$sid/deploys" -d "{\"commitId\": \"${{ github.sha }}\"}" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("deploy", d["id"], d["status"])'
