# 행에서 카페인 실측이 있는 음료가 90% 이상인 신규 브랜드(twosome은 기존 브랜드의 메뉴만 채움, 별도 항목 아님).
# 공식 원두 설명을 확인하지 않아 bean/bean_open이 전부 null이다 — 카드는 caffeine/decaf/milk만 보여주고
# 취향(산미·바디·단맛) 매칭은 중립(0.5)으로 채점된다(app/core/scoring.py score_item, tests/app/test_repo.py
# test_brand_items_and_scoring_work_without_a_bean_profile). decaf_available/decaf_surcharge_krw은 이 DB의
# 디카페인 표기 유무로만 추정했다(브랜드 공식 정책 미확인).
