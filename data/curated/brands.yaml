# 프랜차이즈 브랜드 수기 정리. 공식 페이지 직접 확인은 [공식], 뉴스·검색 요약은 [뉴스] 로 표시.
# bean / decaf_bean: 1~5 값. label_source가 값마다 출처를 적는다(docs/adr/0012-official-brand-beans.md):
#   official_gauge       = 브랜드가 게시한 수치 그대로(투썸은 0~100% 막대 → 1 + 4·p/100, 소수 한 자리)
#   official_notes_model = 공식 원두 설명(data/curated/brand_beans_official.yaml)을 학습 모델+문구 규칙에 넣은 값
#                          (scripts/derive_brand_beans.py → data/eval/brand_beans_derived.json)
#   estimate             = 공식 맛 설명이 없어(봇 차단·설명 없음) notes/뉴스에서 손으로 추정한 값
# bean_open / decaf_bean_open: 오픈판(DATA_VARIANT=open, 공모전 제출)이 대신 쓰는 값. 전체판 학습 모델은 coffeereview 라벨로
#   학습돼(ADR 0008/0009) 오픈판에 쓸 수 없으므로 라이선스 제약 없는 출처만 쓴다 (scripts/derive_brand_beans.py --variant open
#   → data/eval/brand_beans_derived_open.json):
#   official_cue         = 공식 문구 속 명시적 단서("묵직한 바디", "상큼한")·브랜드가 직접 쓴 향미 단어
#   open_feature_model   = 산미·단맛만: 로스터리 게이지 특징 모델(config/feature_model_open.json)에 공식 사실(산지/블렌드·로스팅·
#                          디카페인 공정·공식 향미 단어 범주)을 넣은 값
#   estimate             = ADR 0012 이전 손 추정값(뉴스·notes)
# official_note 는 추천 카드 근거 줄에 그대로 보이는 공식 문구 한 줄. 실측이 아니므로 추천 신뢰도는 medium으로 표시된다.
