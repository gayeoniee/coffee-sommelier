# 프랜차이즈 10곳의 "공식" 원두 설명 — 사실만 옮긴다(인용은 원문 그대로, 해석·추정 없음).
# 수집: pipeline.http.PoliteClient(robots.txt 준수, 호스트당 지연)로 공식 사이트를 직접 읽었다. 메뉴 원문
# 스냅샷(data/raw/<brand>/<날짜>/)은 파이프라인 수집기가 같은 방식으로 받은 것이다.
# 이 파일의 사실 → 산미·바디·단맛·향미 값으로 옮기는 과정은 scripts/derive_brand_beans.py 가 하고, 그 결과(값마다
# label_source: official_gauge | official_notes_model | estimate)가 data/curated/brands.yaml 의 bean/decaf_bean
# 에 반영된다. docs/adr/0012-official-brand-beans.md.
#
# 필드
#   bean_name        공식 원두/블렌드 이름 (매장 음료에 쓰인다고 공식 문구가 말하는 원두)
#   role_evidence    그 원두가 매장 음료용이라는 근거 문구(원문)
#   roast            공식 로스팅 표기(원문); roast_level 은 그 표기를 카탈로그 척도(light~dark)로 옮긴 값
#   origins          공식 산지/블렌드 구성(원문). 없으면 null
#   notes            공식 맛 설명(원문 인용, 여러 개면 목록)
#   gauges           공식 산미/바디/단맛 수치(1~5 척도로 게시된 경우만). 없으면 null
#   gauges_pct       공식 산미/바디 막대(0~100%, 투썸). derive_brand_beans.gauge_from_percent 로 1~5 환산
#   status           official(맛 설명 있음) | partial(로스팅·공정만 있음) | unavailable(공식 설명 없음/접근 불가)
#   card_note        추천 카드 근거 줄에 그대로 보여줄 한 줄(공식 문구만 발췌; 설명 LLM에도 들어가므로 영어 단어는 뺀다)

