# 설명 품질 평가 케이스 (손으로 작성, 24개) — `python -m app.eval explain_quality`
# 손님은 app.eval.PERSONAS의 가상 페르소나, 항목 값은 DB에서 본 것과 비슷하게 적은 것(개인 데이터 없음).
# score는 app.core.scoring.score_item이 이 항목·페르소나에 주는 값(소수 2자리), violation은 app.core.scoring.passes의 문구.
# id = <브랜드|출처>_<조건>_<점수대>
# 구성: 페르소나 4 × {메뉴 실측, 브랜드 원두 추정, DB 원두, 예측 원두} = 16
#       + 조건 위반 4 (DB/예측 원두; '제한없음'은 위반이 불가능해 '디카페인+우유X+단맛'에 2개)
#       + 극단 점수 4 (≤0.35 두 개 *_low, ≥0.95 두 개 *_top)
# 점수 공식이 관대해(향미 적합도 최저 0.5) 기본 케이스도 절반가량 0.85를 넘는다. 0.35 이하는 태그 없는 원두에서만 나온다.

