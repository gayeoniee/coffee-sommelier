[project]
name = "coffee-sommelier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "psycopg[binary]>=3.2",
  "kaggle>=1.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs running Postgres (docker compose up -d db)"]
