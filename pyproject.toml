[project]
name = "coffee-sommelier"
version = "0.1.0"
requires-python = ">=3.12"
# Runtime deps of the API (app/). The data pipeline's extra deps live in the "pipeline" group so the
# deploy image (Dockerfile: uv sync --no-default-groups) stays small; a plain `uv sync` still installs everything.
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "langgraph>=1.2,<2",
  "fastapi>=0.140",
  "uvicorn[standard]>=0.30",
  "psycopg-pool>=3.2",
  "langfuse>=4.15,<5",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8",
]
pipeline = [
  "pandas>=2.2",
  "numpy>=1.26",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "kaggle>=1.6",
]

[tool.uv]
package = false
default-groups = ["dev", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs running Postgres (docker compose up -d db)"]
