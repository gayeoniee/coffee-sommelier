providers:
  ollama:
    base_url: http://localhost:11434/v1
    api_key_env: null
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY

tasks:
  enrich:
    provider: ollama
    model: "qwen3.5:9b"
    timeout: 180
    max_tokens: 2048
    extra: {reasoning_effort: "none"}
  # Embedding model used everywhere (pipeline embed/load, app queries, eval) = task "embed",
  # or the task named by $EMBED_TASK. Vectors are cached per model under data/embedded/<model>/.
  # Switching models means re-running `pipeline run --only embed --only load` (see docs/adr/0003).
  # Hosted, asymmetric (passage/query); native 2048 dims, Matryoshka-trained -> sliced to 1024 for vector(1024).
  embed:
    provider: nvidia
    model: nvidia/nemotron-3-embed-1b
    timeout: 60
    dims: 1024
    asymmetric: true
    batch: 32
    rpm: 35
  # previous default, local only (Ollama): EMBED_TASK=embed_bge_m3
  embed_bge_m3:
    provider: ollama
    model: bge-m3
    timeout: 120
  vision:
    provider: nvidia
    model: meta/llama-3.2-11b-vision-instruct
    timeout: 30
    max_tokens: 800
    fallback: {provider: ollama, model: "qwen3.5:9b", timeout: 120, max_tokens: 2048}
  answer:
    provider: nvidia
    model: deepseek-ai/deepseek-v4.1-flash
    timeout: 30
    max_tokens: 1500
    fallback: {provider: ollama, model: "qwen3.5:9b", timeout: 120, max_tokens: 2048}
  # gold-set labeller: must differ from the enrich model, so no local fallback
  judge:
    provider: nvidia
    model: deepseek-ai/deepseek-v4.1-flash
    timeout: 120
    max_tokens: 3000
  # second judge from a different vendor, for inter-judge agreement.
  # 1단계 골드셋 라벨링(data/eval/gold_enrich_judge2.csv)을 만든 모델 — 재현성을 위해 그대로 둔다.
  judge2:
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
    timeout: 120
    max_tokens: 4000
    extra: {chat_template_kwargs: {enable_thinking: false}}
  # 설명 품질 평가(app.eval explain_quality)의 두 번째 판정자. judge2(nemotron)는 설명 생성 모델(explain)과 같아
  # 자기 채점이 되므로 다른 벤더로 따로 둔다(ADR 0005 "2차"; 결과 JSON에서는 "judge2" 자리에 기록).
  # 후보 탐침: gemma-4-31b 55~98초, kimi-k3 138초(thinking 켜면 JSON 깨짐), glm-5.3-flash 180초 타임아웃,
  # gpt-oss-20b 2.4~3.0초·JSON 준수 → 채택. thinking을 끌 수 없는 모델이라 reasoning_effort를 low로.
  judge_explain2:
    provider: nvidia
    model: openai/gpt-oss-20b
    timeout: 120
    max_tokens: 4000
    extra: {reasoning_effort: low}
  # 2단계 앱: 추천 설명(스트리밍), 후기·원두 파싱. 원격 실패 시 로컬 폴백.
  # max_tokens 220: 한국어 2문장 ≈ 40~140토큰. 1500이면 4~5문장·자기수정 덧붙임까지 다 흘러나왔다(ADR 0005 "2차").
  explain:
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
    timeout: 20
    max_tokens: 220
    extra: {chat_template_kwargs: {enable_thinking: false}}
    fallback: {provider: ollama, model: "qwen3.5:9b", timeout: 60, max_tokens: 400, extra: {reasoning_effort: "none"}}
  parse_note:
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
    timeout: 20
    max_tokens: 1500
    extra: {chat_template_kwargs: {enable_thinking: false}}
    fallback: {provider: ollama, model: "qwen3.5:9b", timeout: 60, max_tokens: 400, extra: {reasoning_effort: "none"}}
  parse_bean:
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
    timeout: 20
    max_tokens: 1500
    extra: {chat_template_kwargs: {enable_thinking: false}}
    fallback: {provider: ollama, model: "qwen3.5:9b", timeout: 60, max_tokens: 400, extra: {reasoning_effort: "none"}}
