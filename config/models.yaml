providers:
  ollama:
    base_url: http://localhost:11434/v1
    api_key_env: null
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY

tasks:
  enrich:
    provider: ollama
    model: "qwen3.5:9b"
    timeout: 180
    max_tokens: 2048
    extra: {reasoning_effort: "none"}
  # Embedding model used everywhere (pipeline embed/load, app queries, eval) = task "embed",
  # or the task named by $EMBED_TASK. Vectors are cached per model under data/embedded/<model>/.
  # Switching models means re-running `pipeline run --only embed --only load` (see docs/adr/0003).
  # Hosted, asymmetric (passage/query); native 2048 dims, Matryoshka-trained -> sliced to 1024 for vector(1024).
  embed:
    provider: nvidia
    model: nvidia/nemotron-3-embed-1b
    timeout: 60
    dims: 1024
    asymmetric: true
    batch: 32
    rpm: 35
  # previous default, local only (Ollama): EMBED_TASK=embed_bge_m3
  embed_bge_m3:
    provider: ollama
    model: bge-m3
    timeout: 120
  vision:
    provider: nvidia
    model: meta/llama-3.2-11b-vision-instruct
    timeout: 30
    max_tokens: 800
    fallback: {provider: ollama, model: "qwen3.5:9b", timeout: 120, max_tokens: 2048}
  answer:
    provider: nvidia
    model: deepseek-ai/deepseek-v4.1-flash
    timeout: 30
    max_tokens: 1500
    fallback: {provider: ollama, model: "qwen3.5:9b", timeout: 120, max_tokens: 2048}
  # gold-set labeller: must differ from the enrich model, so no local fallback
  judge:
    provider: nvidia
    model: deepseek-ai/deepseek-v4.1-flash
    timeout: 120
    max_tokens: 3000
  # second gold-set labeller from a different vendor, for inter-judge agreement
  judge2:
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
    timeout: 120
    max_tokens: 4000
  # 2단계 앱: 추천 설명(스트리밍), 후기·원두 파싱. 원격 실패 시 로컬 폴백.
  explain:
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
    timeout: 20
    max_tokens: 1500
    fallback: {provider: ollama, model: "qwen3.5:9b", timeout: 60, max_tokens: 400, extra: {reasoning_effort: "none"}}
  parse_note:
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
    timeout: 20
    max_tokens: 1500
    fallback: {provider: ollama, model: "qwen3.5:9b", timeout: 60, max_tokens: 400, extra: {reasoning_effort: "none"}}
  parse_bean:
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
    timeout: 20
    max_tokens: 1500
    fallback: {provider: ollama, model: "qwen3.5:9b", timeout: 60, max_tokens: 400, extra: {reasoning_effort: "none"}}
